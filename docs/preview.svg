<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" fill="none">
  <rect width="880" height="420" rx="18" fill="#0F1117"/>
  <!-- Left: DSH Chat Panel -->
  <rect x="20" y="20" width="280" height="380" rx="14" fill="#171A23" stroke="#2A3042" stroke-width="1.5"/>
  <text x="40" y="52" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">DeepSeek Harness Chat</text>
  <rect x="36" y="74" width="248" height="62" rx="10" fill="#23293A"/>
  <text x="48" y="98" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Create a 3-shot cyberpunk storyboard</text>
  <text x="48" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">and generate keyframes on the canvas.</text>
  <rect x="36" y="152" width="248" height="92" rx="10" fill="#1D2433" stroke="#38BDF8" stroke-opacity="0.4"/>
  <text x="48" y="176" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">canvas_list_models()</text>
  <text x="48" y="196" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">canvas_create_generation_flow()</text>
  <text x="48" y="216" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="11">generation_get_status()</text>
  <text x="48" y="234" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Updated 4 nodes &amp; started generation.</text>
  <!-- Bottom composer chip -->
  <rect x="36" y="346" width="248" height="38" rx="10" fill="#12151E" stroke="#2A3042"/>
  <rect x="46" y="354" width="118" height="22" rx="11" fill="#1E293B" stroke="#22C55E" stroke-opacity="0.6"/>
  <circle cx="58" cy="365" r="3.5" fill="#22C55E"/>
  <text x="68" y="369" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Infinite Canvas</text>

  <!-- Right: Embedded Infinite Canvas -->
  <rect x="316" y="20" width="544" height="380" rx="14" fill="#141720" stroke="#2A3042" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="317" y="21" width="542" height="38" rx="13" fill="#1A1E2B"/>
  <circle cx="338" cy="40" r="4" fill="#22C55E"/>
  <text x="350" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Project Folder Canvas</text>
  <rect x="498" y="30" width="76" height="20" rx="10" fill="#23293A"/>
  <text x="510" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Connected</text>
  <rect x="582" y="30" width="96" height="20" rx="10" fill="#23293A"/>
  <text x="594" y="44" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="10.5">local-repo:built</text>

  <!-- Subtle canvas dots -->
  <g fill="#334155" opacity="0.55">
    <circle cx="360" cy="100" r="1.5"/><circle cx="420" cy="100" r="1.5"/><circle cx="480" cy="100" r="1.5"/><circle cx="540" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/><circle cx="660" cy="100" r="1.5"/><circle cx="720" cy="100" r="1.5"/><circle cx="780" cy="100" r="1.5"/>
    <circle cx="360" cy="160" r="1.5"/><circle cx="420" cy="160" r="1.5"/><circle cx="480" cy="160" r="1.5"/><circle cx="540" cy="160" r="1.5"/><circle cx="600" cy="160" r="1.5"/><circle cx="660" cy="160" r="1.5"/><circle cx="720" cy="160" r="1.5"/><circle cx="780" cy="160" r="1.5"/>
    <circle cx="360" cy="220" r="1.5"/><circle cx="420" cy="220" r="1.5"/><circle cx="480" cy="220" r="1.5"/><circle cx="540" cy="220" r="1.5"/><circle cx="600" cy="220" r="1.5"/><circle cx="660" cy="220" r="1.5"/><circle cx="720" cy="220" r="1.5"/><circle cx="780" cy="220" r="1.5"/>
    <circle cx="360" cy="280" r="1.5"/><circle cx="420" cy="280" r="1.5"/><circle cx="480" cy="280" r="1.5"/><circle cx="540" cy="280" r="1.5"/><circle cx="600" cy="280" r="1.5"/><circle cx="660" cy="280" r="1.5"/><circle cx="720" cy="280" r="1.5"/><circle cx="780" cy="280" r="1.5"/>
  </g>

  <!-- Edges -->
  <path d="M484 148 C525 148, 525 148, 560 148" stroke="#38BDF8" stroke-width="2.5"/>
  <path d="M484 268 C535 268, 525 170, 560 170" stroke="#818CF8" stroke-width="2.2"/>
  <path d="M694 158 C725 158, 725 220, 742 220" stroke="#34D399" stroke-width="2.5"/>

  <!-- Prompt Node -->
  <rect x="348" y="106" width="136" height="84" rx="10" fill="#1E2534" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="360" y="128" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Text Prompt</text>
  <rect x="360" y="140" width="108" height="8" rx="4" fill="#334155"/>
  <rect x="360" y="156" width="88" height="8" rx="4" fill="#334155"/>
  <rect x="360" y="172" width="64" height="8" rx="4" fill="#334155"/>

  <!-- Ref Image Node -->
  <rect x="348" y="220" width="136" height="96" rx="10" fill="#1E2534" stroke="#818CF8" stroke-width="1.5"/>
  <text x="360" y="242" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Reference Frame</text>
  <rect x="360" y="252" width="112" height="52" rx="6" fill="#293148"/>

  <!-- Image Gen Node -->
  <rect x="560" y="106" width="134" height="106" rx="10" fill="#1E2534" stroke="#34D399" stroke-width="1.8"/>
  <text x="572" y="128" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Image Node (autoRun)</text>
  <rect x="572" y="138" width="110" height="62" rx="6" fill="#172A2B"/>

  <!-- Video Gen Node -->
  <rect x="742" y="174" width="96" height="104" rx="10" fill="#1E2534" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="752" y="196" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Video Node</text>
  <rect x="752" y="206" width="76" height="60" rx="6" fill="#2A2417"/>

  <!-- Footer persistence callout -->
  <text x="338" y="382" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">Persisted in &lt;project&gt;/.infinite-canvas/  |  Shared keys in ~/.infinite-canvas/shared</text>
</svg>
